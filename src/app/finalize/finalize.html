<div class="finalize-container">
  <header class="finalize-header">
    <h1>Finalize Participants</h1>
    <div class="header-actions">
      <button type="button" class="back-btn" (click)="goBackToOrganize()">
        ← Back to Organize
      </button>
    </div>
  </header>

  <p class="count">Players: {{ tournamentStore.participants().length }}</p>

  @if (tournamentStore.participants().length === 0) {
    <p class="empty">No participants yet. Go back to Organize to add players.</p>
  } @else {
    <ul class="player-list">
      @for (p of tournamentStore.participants(); track p.id; let i = $index) {
        <li
          class="player-row"
          [class.dragging]="dragIndex() === i"
          draggable="true"
          (dragstart)="onDragStart(i)"
          (dragend)="onDragEnd()"
          (dragover)="$event.preventDefault()"
          (drop)="onDrop(i)"
        >
          <span class="drag-handle" aria-hidden="true">⠿</span>

          <div class="name-fields">
            <input
              class="name-input"
              type="text"
              [value]="drafts()[p.id]?.first ?? ''"
              (input)="onNameInput(p.id, 'first', $event)"
              (blur)="commitName(p.id)"
              (keydown.enter)="commitName(p.id)"
              placeholder="First name"
              aria-label="First name for {{ p.firstName }} {{ p.lastName }}"
            />
            <input
              class="name-input"
              type="text"
              [value]="drafts()[p.id]?.last ?? ''"
              (input)="onNameInput(p.id, 'last', $event)"
              (blur)="commitName(p.id)"
              (keydown.enter)="commitName(p.id)"
              placeholder="Last name"
              aria-label="Last name for {{ p.firstName }} {{ p.lastName }}"
            />
          </div>

          <button
            type="button"
            class="remove-btn"
            (click)="removeParticipant(p.id)"
            aria-label="Remove {{ p.firstName }} {{ p.lastName }}"
          >
            &times;
          </button>
        </li>
      }
    </ul>
  }
</div>
